info:
  name: LOGIN
  type: http

http:
  method: POST
  url: http://localhost:8080/auth/login
  body:
    type: json
    data: |-
      {
        "email": "your-existing-user@example.com",
        "password": "your-password"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
